services:
  razze-api:
    build: .
    restart: unless-stopped
    environment:
      RAZZE_ADMIN_TOKEN: ${RAZZE_ADMIN_TOKEN:?Defina RAZZE_ADMIN_TOKEN no arquivo .env}
      RAZZE_API_HOST: 0.0.0.0
      RAZZE_API_PORT: 8787
      RAZZE_DB_PATH: /data/razze.sqlite
      RAZZE_STUN_HOST: 0.0.0.0
      RAZZE_STUN_PORT: 3478
      RAZZE_TRUST_PROXY: "1"
      RAZZE_PUBLIC_URL: https://${API_DOMAIN}
      RAZZE_GOOGLE_CLIENT_ID: ${RAZZE_GOOGLE_CLIENT_ID:-}
      RAZZE_GOOGLE_CLIENT_SECRET: ${RAZZE_GOOGLE_CLIENT_SECRET:-}
    expose:
      - "8787"
    ports:
      - "3478:3478/udp"
    volumes:
      - razze-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN no arquivo .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      razze-api:
        condition: service_healthy

volumes:
  razze-data:
  caddy-data:
  caddy-config:
