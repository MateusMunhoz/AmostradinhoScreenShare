# /etc/turnserver.conf — coturn (STUN + TURN) do modo Internet do Tela P2P
#
# Troque os dois valores marcados com TROQUE. O segredo tem que ser o MESMO do TURN_SECRET em
# /etc/tela-p2p-internet.env: o servidor da sala usa ele para dar a cada pessoa um acesso temporário.

# Porta do STUN/TURN (UDP e TCP). 3479 e não 3478 porque a RazzeAPI já usa a 3478 UDP para STUN.
listening-port=3479

# TROQUE: o IP público da VPS (o do painel da Hostinger)
external-ip=IP_DA_VPS

realm=tela-p2p

# Acesso temporário (usuário "validade:nome" + senha HMAC): nada de senha fixa dentro do app
use-auth-secret
# TROQUE: o mesmo valor de TURN_SECRET (gere com: openssl rand -hex 32)
static-auth-secret=SEGREDO_DO_TURN

fingerprint

# Portas por onde o vídeo passa quando precisa do relay (liberar no firewall como UDP)
min-port=49160
max-port=49999

# Teste: sem TLS (TURN na 443/5349 com certificado fica para depois)
no-tls
no-dtls
no-cli
no-multicast-peers

# Segurança: ninguém usa o seu TURN para chegar em redes internas (nem na VPN Razze)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limites: relays por usuário (cada conexão de tela ou voz usa um) e no total
user-quota=40
total-quota=400
# Banda máxima por relay, em bytes/s (6 MB/s ≈ 48 Mbit/s: sobra para 1080p60). 0 = sem limite
max-bps=6000000

simple-log
log-file=/var/log/turnserver/turnserver.log
